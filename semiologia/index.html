<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semiologia ortopédica na APS</title>
<meta name="description" content="Consulta rápida de semiologia ortopédica para profissionais da atenção primária: bandeiras vermelhas, exame dirigido, diagnósticos, conduta e encaminhamento.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
--paper:#F3F6F5;--surface:#FFFFFF;--surface2:#EDF3F1;
--ink:#14201E;--ink2:#4B5B58;--line:#D3DCD9;
--drape:#2C6B67;--drape-ink:#FFFFFF;--drape-soft:#E1EEEC;
--violet:#5A3CA0;--violet-soft:#EDE7F8;
--flag:#B42318;--flag-soft:#F7DFDB;--flag-ink:#7A1710;--flag-on:#FFFFFF;
--warn:#A86F12;--warn-soft:#F5E9D2;--warn-ink:#6B470B;
--ok:#2C6B67;--ok-soft:#E1EEEC;
--shadow:0 1px 2px rgba(20,32,30,.06),0 10px 28px rgba(20,32,30,.07);
color-scheme:light;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--paper:#101715;--surface:#18211F;--surface2:#1C2926;
--ink:#E5ECEA;--ink2:#9EB1AD;--line:#2A3633;
--drape:#6CC0B7;--drape-ink:#0E1A18;--drape-soft:#1C3532;
--violet:#B19DEB;--violet-soft:#2A2340;
--flag:#F2796B;--flag-soft:#3A1F1C;--flag-ink:#FFB4A8;--flag-on:#1A0F0D;
--warn:#E3B356;--warn-soft:#3A2F1A;--warn-ink:#F3D28C;
--ok:#6CC0B7;--ok-soft:#1C3532;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
color-scheme:dark;
}
}
:root[data-theme="dark"]{
--paper:#101715;--surface:#18211F;--surface2:#1C2926;
--ink:#E5ECEA;--ink2:#9EB1AD;--line:#2A3633;
--drape:#6CC0B7;--drape-ink:#0E1A18;--drape-soft:#1C3532;
--violet:#B19DEB;--violet-soft:#2A2340;
--flag:#F2796B;--flag-soft:#3A1F1C;--flag-ink:#FFB4A8;--flag-on:#1A0F0D;
--warn:#E3B356;--warn-soft:#3A2F1A;--warn-ink:#F3D28C;
--ok:#6CC0B7;--ok-soft:#1C3532;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--topbar,64px) + 58px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--paper)}
a{color:var(--drape)}
h1,h2,h3{font-family:"Archivo","Arial Narrow","Helvetica Neue",system-ui,sans-serif;line-height:1.08;margin:0}
p{margin:0}
button{font:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--drape);color:var(--drape-ink);padding:10px 14px;border-radius:8px;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
#main h1:focus{outline:none}
.small{font-size:14px;color:var(--ink2)}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .bar{display:flex;align-items:center;gap:16px;padding:10px 0;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--drape);color:var(--drape-ink);display:grid;place-items:center;flex:none}
.brand .name{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-stretch:72%;font-size:20px;line-height:1}
.brand .name span{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:2px}
.searchbox{position:relative;flex:1 1 300px;max-width:520px;margin-left:auto}
.searchbox .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink2);pointer-events:none;display:flex}
.searchbox input{width:100%;font:inherit;font-size:15px;padding:10px 44px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);-webkit-appearance:none}
.searchbox input::placeholder{color:var(--ink2);opacity:.85}
.searchbox input:focus{outline:3px solid var(--violet);outline-offset:1px;border-color:var(--drape)}
.searchbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px/1 "Atkinson Hyperlegible",system-ui,sans-serif;border:1px solid var(--line);border-radius:5px;padding:3px 5px;color:var(--ink2);background:var(--paper);pointer-events:none}
.search-panel{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:min(70vh,540px);overflow:auto;z-index:90;padding:6px}
.search-panel[hidden]{display:none}
.sr-item{display:block;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink)}
.sr-item:hover,.sr-item:focus{background:var(--surface2)}
.sr-item .tipo{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--drape);margin-right:6px}
.sr-item .tit{font-weight:700}
.sr-item .desc{display:block;font-size:13px;line-height:1.4;color:var(--ink2);margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-empty{padding:12px;color:var(--ink2);font-size:14px}
.navlinks{display:flex;align-items:center;gap:1px;flex-wrap:wrap}
.navlinks a,.navlinks button{font-size:14px;color:var(--ink2);text-decoration:none;border:0;background:none;padding:7px 9px;border-radius:8px;cursor:pointer}
.navlinks a:hover,.navlinks button:hover{background:var(--surface2);color:var(--ink)}
.navlinks a.danger{color:var(--flag-ink);font-weight:700}
.navlinks a[aria-current="page"]{background:var(--surface2);color:var(--ink);font-weight:700}
@media(max-width:900px){
header.top .bar{gap:8px}
.brand{order:1}
.navlinks{order:2;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.searchbox{order:3;flex-basis:100%;max-width:none;margin-left:0}
}
/* home */
.hero{padding:42px 0 26px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--drape);margin-bottom:10px}
h1{font-family:"Archivo","Arial Narrow",system-ui,sans-serif;font-weight:800;font-stretch:72%;font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.02;letter-spacing:-.01em;max-width:18ch}
.hero p{color:var(--ink2);font-size:18px;max-width:62ch;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip:hover{border-color:var(--drape);color:var(--drape)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-title h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;font-stretch:74%}
.section-title span{font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.reg-card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.reg-card:hover{border-color:var(--drape);transform:translateY(-1px)}
.reg-card .ico{width:44px;height:44px;border-radius:12px;background:var(--drape-soft);color:var(--drape);display:grid;place-items:center;flex:none}
.reg-card h3{font-size:1.15rem;font-weight:800;font-stretch:80%;margin:0 0 3px}
.reg-card p{font-size:14px;color:var(--ink2);margin:0}
.reg-card .status{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--drape)}
.reg-card.soon{opacity:.58;cursor:not-allowed}
.reg-card.soon .status{color:var(--ink2)}
.global-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.global-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
.global-card:hover{border-color:var(--drape)}
.global-card.alerta{border-color:var(--flag);background:var(--flag-soft)}
.global-card.alerta h3{color:var(--flag-ink)}
.global-card h3{font-size:1.05rem;margin:0 0 4px}
.global-card p{font-size:14px;color:var(--ink2);margin:0}
/* region */
.regiao-head{padding:30px 0 16px;border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--ink2);text-decoration:none;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
.regiao-head h1{font-size:clamp(2.2rem,5.5vw,3.6rem)}
.regiao-head .lede{max-width:65ch;margin-top:10px;color:var(--ink2);font-size:18px}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--ink2);background:var(--surface)}
.badge.draft{border-color:var(--warn);color:var(--warn-ink);background:var(--warn-soft)}
.badge.ok{border-color:var(--drape);color:var(--drape);background:var(--drape-soft)}
.badge.urgent{border-color:var(--flag);color:var(--flag-ink);background:var(--flag-soft)}
.badge.priority{border-color:var(--warn);color:var(--warn-ink);background:var(--warn-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font-size:14px;border:1px solid var(--drape);background:var(--drape);color:var(--drape-ink);border-radius:9px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--drape)}
.btn.ghost:hover{background:var(--drape-soft)}
.btn.danger{background:var(--flag);border-color:var(--flag);color:var(--flag-on)}
.btn:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.mode button{font-size:13px;border:0;background:none;color:var(--ink2);padding:7px 12px;cursor:pointer}
.mode button+button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"]{background:var(--drape);color:var(--drape-ink);font-weight:700}
.mode button:focus-visible{outline:3px solid var(--violet);outline-offset:-3px}
main[data-mode="consulta"] #conteudo{display:none}
main[data-mode="consulta"] .subnav{display:none}
main[data-mode="estudo"] #guia{display:none}
.guia-wrap{max-width:820px}
.guia-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.guia-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);margin-bottom:14px}
.guia-progress .bar{flex:1;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
.guia-progress .bar i{display:block;height:100%;background:var(--drape);border-radius:999px;transition:width .2s}
.guia-card h2{font-size:clamp(1.5rem,4.4vw,2.2rem);line-height:1.1;margin:0 0 6px}
.guia-card .guia-summary{font-size:16px;color:var(--ink2);margin:0}
.guia-options{display:grid;gap:8px;margin-top:18px}
.guia-opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px 16px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.guia-opt:hover{border-color:var(--drape);background:var(--drape-soft)}
.guia-opt::after{content:"→";color:var(--drape);font-weight:700}
.guia-opt:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.guia-foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.guia-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:10px}
.guia-block h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
.guia-block ul{margin:0;padding-left:18px}
.guia-block li{font-size:14px;line-height:1.45;margin:3px 0}
.guia-block.red{border-color:var(--flag);background:var(--flag-soft)}
.guia-block.red h3{color:var(--flag-ink)}
.guia-block.green{border-color:var(--drape);background:var(--drape-soft)}
.guia-block.green h3{color:var(--drape)}
.guia-answers{font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.5}
.guia-answers summary{cursor:pointer;font-weight:700;color:var(--drape)}
.guia-answers p{margin:6px 0 0}
/* tests library */
.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.test-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.test-card:hover{border-color:var(--drape)}
.test-card h3{font-size:1.1rem;margin:8px 0 4px}
.test-card p{font-size:14px;color:var(--ink2);margin:0}
.test-card .test-region{display:block;margin-top:8px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.test-card .badge{margin-bottom:6px}
.demo-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.demo-grid{grid-template-columns:1fr}}
.demo-canvas{width:100%;height:420px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:none;position:relative}
.demo-canvas canvas{display:block;width:100%;height:100%}
@media(max-width:640px){.demo-canvas{height:340px}}
.demo-fallback{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.demo-fallback svg{display:block;width:100%;height:auto}
.demo-hint{font-size:12px;color:var(--ink2);margin-top:6px}
.demo-controls .panel{margin-top:0}
.demo-controls .panel + .panel{margin-top:10px}
.range-label{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:10px 0 4px}
.range-label output{color:var(--drape)}
.demo-controls input[type=range]{width:100%;accent-color:var(--drape)}
.demo-controls .chip{margin-top:8px;display:flex;width:100%;justify-content:flex-start}
.demo-controls .actions{margin-top:12px}
.steps{margin:0;padding-left:20px}
.steps li{font-size:14px;margin:5px 0;line-height:1.45}
.demo-result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:640px){.demo-result{grid-template-columns:1fr}}
.demo-result .panel h3{margin-bottom:4px}
.demo-result .panel p{font-size:14px}
.guia-tests{font-size:13px;color:var(--ink2);margin-top:10px}
.guia-tests a{color:var(--drape);font-weight:700}
.hero-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
/* evidence */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ev-test{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ev-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev-head h3{font-size:1.05rem;margin:0;line-height:1.2}
.ev-metrics{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:8px 0 4px}
.ev-metrics b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
.ev-metrics span{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-size:1.25rem;line-height:1.1}
.ev-bar{height:5px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:4px}
.ev-bar i{display:block;height:100%;background:var(--drape);border-radius:999px}
.ev-bar i.na{width:100%;background:var(--line)}
.ev-link{font-size:13px;font-weight:700;color:var(--drape);text-decoration:none;margin-top:auto}
.ev-link:hover{text-decoration:underline}
.ev-note{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-top:14px}
/* imaging */
.img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.img-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--drape);border-radius:12px;padding:14px 16px}
.img-card h3{font-size:1.05rem;margin:0 0 4px}
.img-card .num{font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-stretch:72%;font-size:2rem;line-height:1;color:var(--drape);margin:6px 0}
.img-card p{font-size:14px;color:var(--ink2);margin:0}
.img-card ul{margin:6px 0 0;padding-left:17px;font-size:14px}
.img-card li{margin:2px 0}
.page-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#conteudo{display:flex;flex-direction:column}
.sec-bandeiras{order:1}
.sec-em30{order:2}
.sec-detail-anamnese{order:3}
.sec-detail-exame{order:4}
.sec-fluxo{order:5}
.sec-exame-chave{order:6}
.sec-diagnosticos{order:7}
.sec-imagem{order:8}
.sec-encaminhamento{order:9}
.sec-perolas{order:10}
.sec-detail-refs{order:11}
main[data-mode="consulta"] .sec-detail{display:none}
main[data-mode="consulta"] .dx .dxrow[data-row="testes"]{display:none}
main[data-mode="consulta"] #btnEvidence{display:none}
main[data-mode="estudo"] .consulta-only{display:none}
.subnav{position:sticky;top:var(--topbar,64px);z-index:40;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav .wrap{display:flex;gap:1px;padding-top:4px;padding-bottom:4px}
.subnav a{font-size:13px;color:var(--ink2);text-decoration:none;padding:7px 9px;border-radius:7px}
.subnav a:hover{background:var(--surface2);color:var(--ink)}
.sec{padding:32px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--topbar,64px) + 54px)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;font-stretch:74%;margin:0 0 6px}
.sec .sub{color:var(--ink2);font-size:16px;max-width:70ch;margin:0 0 16px}
.sec h3{font-size:1.2rem;font-weight:800;font-stretch:80%;margin:18px 0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel + .panel{margin-top:10px}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.panel ul{margin:0;padding-left:18px}
.panel li{font-size:14px;margin:3px 0}
/* 30 seconds */
.em30{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.em30{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.em30{grid-template-columns:1fr}}
.em30 .mini{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}

.em30 ul{margin:0;padding-left:17px}
.em30 li{font-size:14px;line-height:1.45;margin:4px 0}
.em30 .mini.red{border-color:var(--flag);background:var(--flag-soft)}
.em30 .mini.red h3{color:var(--flag-ink)}
.em30 .mini.green{border-color:var(--drape);background:var(--drape-soft)}
.em30 .mini.green h3{color:var(--drape)}
/* flags */
.flagbox{border:1px solid var(--flag);background:var(--flag-soft);border-radius:14px;overflow:hidden}
.flagbox .flaghead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--flag);color:var(--flag-on);font-weight:700;font-size:14px}
.flagbox .flaghead svg{flex:none}
.flagbox ul{list-style:none;margin:0;padding:6px 16px 12px}
.flagbox li{padding:9px 0;border-bottom:1px solid rgba(180,35,24,.16)}
.flagbox li:last-child{border-bottom:0}
.flagbox b{display:block;color:var(--flag-ink);font-size:15px}
.flagbox span{font-size:14px;color:var(--ink)}
/* lists */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qlist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.qlist b{display:block;font-size:15px}
.qlist span{font-size:14px;color:var(--ink2)}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.exam-grid .panel h3{margin-bottom:8px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;scroll-margin-top:calc(var(--topbar,64px) + 60px)}
.test h3{font-size:1.1rem;font-weight:800;font-stretch:82%;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.test .test-id{font-size:10px;color:var(--ink2);font-weight:400;letter-spacing:.04em}
.test p{font-size:14px;line-height:1.5;margin:4px 0}
.test .label{font-weight:700;color:var(--ink)}
.test details{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.test summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--drape)}
.test details p{font-size:14px}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ev span{font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.ev .src{font-weight:400;color:var(--ink2)}
/* diagnoses */
.dx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px;scroll-margin-top:calc(var(--topbar,64px) + 60px)}
.dx h3{font-size:1.2rem;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dx .dxrow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.dx .dxrow:first-of-type{border-top:0}
.dx .dxrow b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding-top:3px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
.dx .dxrow div{font-size:14px;line-height:1.5}
.dx ul{margin:0;padding-left:17px}
.dx li{margin:2px 0}
@media(max-width:520px){.dx .dxrow{grid-template-columns:1fr;gap:2px}.dx .dxrow b{padding-top:0}}
/* flow */
ol.flow{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:passo}
ol.flow li{counter-increment:passo;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
ol.flow li::before{content:counter(passo);font-family:"Archivo","Arial Narrow",sans-serif;font-weight:800;font-stretch:66%;font-size:1.8rem;line-height:1;color:var(--drape)}
ol.flow b{display:block;font-size:15px}
ol.flow span{font-size:14px;color:var(--ink2)}
/* two columns */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.two .panel.do{border-color:var(--drape)}
.two .panel.dont{border-color:var(--warn)}
.two .panel.do h3{color:var(--drape)}
.two .panel.dont h3{color:var(--warn-ink)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two-col{grid-template-columns:1fr}}
.pearl{border-left:4px solid var(--drape);background:var(--drape-soft);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px}
.trap{border-left:4px solid var(--flag);background:var(--flag-soft);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px}
.pearl b,.trap b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
.pearl b{color:var(--drape)}
.trap b{color:var(--flag-ink)}
.pearl p,.trap p{font-size:14px;margin:0;line-height:1.45}
/* checklist */
.checklist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.checklist li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.45}
.checklist li::before{content:"";width:16px;height:16px;border:2px solid var(--line);border-radius:4px;margin-top:3px}
/* references */
.refs{list-style:none;counter-reset:ref;margin:0;padding:0;display:grid;gap:8px}
.refs li{counter-increment:ref;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.45}
.refs li::before{content:counter(ref);font-weight:700;color:var(--drape)}
.refs li .refbody{display:block;min-width:0}
.refs a{word-break:break-word}
/* global flags */
.flag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.gflag{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--flag);border-radius:12px;padding:14px 16px;scroll-margin-top:calc(var(--topbar,64px) + 60px)}
.gflag h3{font-size:1.05rem;margin:0 0 6px}
.gflag h4{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:8px 0 3px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700}
.gflag ul{margin:0;padding-left:17px}
.gflag li{font-size:14px;line-height:1.45;margin:2px 0}
/* placeholder */
.placeholder{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--ink2)}
.placeholder b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.placeholder ul{text-align:left;max-width:60ch;margin:12px auto 0;font-size:14px}
/* footer */
footer{border-top:1px solid var(--line);margin-top:20px;padding:22px 0 36px;color:var(--ink2);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink2)}
footer a:hover{color:var(--ink)}
/* misc */
.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{background:var(--surface)}30%{background:var(--warn-soft)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
/* print */
@media print{
:root{--paper:#fff;--surface:#fff;--surface2:#fff;--ink:#000;--ink2:#333;--line:#bbb;--drape:#000;--drape-ink:#fff;--drape-soft:#f2f2f2;--violet:#000;--flag:#000;--flag-soft:#f2f2f2;--flag-ink:#000;--warn:#000;--warn-soft:#f2f2f2;--warn-ink:#000;--ok:#000;--ok-soft:#f2f2f2}
body{font-size:11pt;background:#fff;color:#000}
header.top,.subnav,.actions,.chips,.search-panel,.crumb{display:none!important}
main{padding:0}
#conteudo{display:block!important}
main[data-mode="consulta"] #conteudo{display:block!important}
#guia{display:none!important}
main[data-mode="consulta"] .sec-detail{display:block!important}
main[data-mode="consulta"] .consulta-only{display:none!important}
main[data-mode="consulta"] .dx .dxrow[data-row="testes"]{display:grid!important}
.mode{display:none!important}
.wrap{max-width:none;padding:0}
.regiao-head{padding-top:0}
.sec{break-inside:avoid;border-bottom:1px solid #ddd;padding:12pt 0}
.sec h2{font-size:16pt}
.test,.dx,.gflag,.panel,.flagbox{break-inside:avoid}
details{display:block}
details>*{display:block!important}
summary{display:none}
details:not([open])>*{display:block!important}
a{color:#000;text-decoration:none}
a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;word-break:break-all}
.refs li::before{color:#000}
.btn{display:none}
}

function search(q){
 var n=norm(q).trim();
 if(n.length<2)return [];
 var STOP={de:1,da:1,do:1,das:1,dos:1,no:1,na:1,nos:1,nas:1,com:1,e:1,a:1,o:1,em:1,para:1,por:1,que:1};
 var toks=n.split(/\s+/).filter(function(t){return t&&!STOP[t]});
 if(!toks.length)toks=[n];
 return INDEX.map(function(e){
  var score=0,tn=norm(e.titulo);
  var all=toks.every(function(t){return e.busca.indexOf(t)>-1});
  if(!all)return null;
  score+=1;
  if(e.tipo==='Região'||e.tipo==='Em breve')score+=12;
  if(tn===n)score+=100;else if(tn.indexOf(n)===0)score+=60;else if(tn.indexOf(n)>-1)score+=40;
  if(e.busca.indexOf(n)>-1)score+=10;
  toks.forEach(function(t){if(tn.indexOf(t)>-1)score+=6});
  return {e:e,score:score};
 }).filter(Boolean).sort(function(a,b){return b.score-a.score||a.e.titulo.localeCompare(b.e.titulo)}).slice(0,12).map(function(x){return x.e});
}
function snippet(text,q){
 var t=String(text||'').replace(/\s+/g,' ').trim();
 if(t.length<=150)return t;
 var n=norm(t),k=norm(q).trim(),i=n.indexOf(k);
 if(i<0)return t.slice(0,150)+'…';
 var start=Math.max(0,i-45);return (start>0?'…':'')+t.slice(start,start+150)+'…';
}

/* ---------- consulta guiada ---------- */
var guiaState={regiao:null,answers:{},order:[],done:false,resultKey:null};
function guiaReset(id){guiaState={regiao:id,answers:{},order:[],done:false,resultKey:null}}
function guiaInit(r){
 if(!r||!r.guia)return false;
 if(guiaState.regiao!==r.id)guiaReset(r.id);
 return true;
}
function guiaVisible(r){
 return (r.guia.perguntas||[]).filter(function(q){
  if(!q.quando)return true;
  return Object.keys(q.quando).every(function(k){return guiaState.answers[k]===q.quando[k]});
 });
}
function guiaNext(r){
 var vis=guiaVisible(r);
 for(var i=0;i<vis.length;i++){if(!(vis[i].id in guiaState.answers))return vis[i]}
 return null;
}
function guiaTotal(r){return (r.guia.perguntas||[]).length||1}
function guiaEvaluate(r){
 var regras=r.guia.regras||[];
 for(var i=0;i<regras.length;i++){
  var q=regras[i].quando||{},ok=true;
  for(var k in q){if(guiaState.answers[k]!==q[k]){ok=false;break}}
  if(ok)return regras[i].resultado;
 }
 return 'inespecifico';
}
function guiaAnswer(r,qid,val){
 guiaState.answers[qid]=val;
 if(guiaState.order.indexOf(qid)===-1)guiaState.order.push(qid);
 if(!guiaNext(r)){guiaState.resultKey=guiaEvaluate(r);guiaState.done=true}
 guiaRender(r);
}
function guiaBack(r){
 var last=guiaState.order.pop();
 if(last)delete guiaState.answers[last];
 guiaState.done=false;guiaState.resultKey=null;
 guiaRender(r);
}
function guiaRestart(r){guiaReset(r.id);guiaRender(r)}
function guiaAnswerSummary(r){
 var labels={};
 (r.guia.perguntas||[]).forEach(function(q){
  labels[q.id]=q.pergunta;
  (q.opcoes||[]).forEach(function(o){labels[q.id+'='+o.valor]=o.label});
 });
 return guiaState.order.map(function(id){
  var val=guiaState.answers[id];
  return esc(labels[id]||id)+': '+esc(labels[id+'='+val]||val);
 }).join(' · ');
}
function guiaQuestion(r,q){
 var total=guiaTotal(r)||1;
 var current=guiaState.order.length+1;
 var pct=Math.round(((current-1)/total)*100);
 var intro=guiaState.order.length===0?'<p class="small" style="margin-bottom:14px">'+esc(r.guia.intro)+'</p>':'';
 var opts=(q.opcoes||[]).map(function(o){
  return '<button class="guia-opt" type="button" data-qid="'+esc(q.id)+'" data-val="'+esc(o.valor)+'">'+esc(o.label)+'</button>';
 }).join('');
 var back=guiaState.order.length?'<button class="btn ghost" type="button" id="guiaVoltar">Voltar</button>':'';
 return '<div class="guia-card">'+intro+
  '<div class="guia-progress"><span>Pergunta '+current+' de '+total+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
  '<h2>'+esc(q.pergunta)+'</h2>'+
  '<div class="guia-options">'+opts+'</div>'+
  '<div class="guia-foot">'+back+'<span class="small" style="align-self:center">Para detalhes e evidência, use Ficha completa.</span></div>'+
  '</div>';
}
function guiaResult(r){
 var res=(r.guia.resultados||{})[guiaState.resultKey]||(r.guia.resultados||{}).inespecifico||{};
 var cls=res.urgencia==='urgente'?'urgent':(res.urgencia==='prioritario'?'priority':'ok');
 var label=res.urgencia==='urgente'?'Urgente':(res.urgencia==='prioritario'?'Prioritário':'Rotina');
 var summary=guiaAnswerSummary(r);
 var tests=(res.testes||[]).map(function(id){var f=findTest(id);if(!f)return '';return '<a href="#/testes/'+esc(id)+'">'+esc(f.teste.nome)+'</a>'}).filter(Boolean).join(' · ');
 return '<div class="guia-card">'+
  '<div class="meta-row"><span class="badge '+cls+'">'+label+'</span><span class="badge">'+esc(r.nome)+'</span></div>'+
  '<h2>'+esc(res.titulo||'Resultado')+'</h2>'+
  '<p class="guia-summary">'+esc(res.resumo||'')+'</p>'+
  '<div class="guia-block red"><h3>Não perder</h3>'+bullets(res.naoPerder)+'</div>'+
  '<div class="guia-block"><h3>Exame agora</h3>'+bullets(res.exame)+'</div>'+
  '<div class="guia-block green"><h3>Conduta inicial</h3>'+bullets(res.conduta)+'</div>'+
  '<div class="guia-block"><h3>Encaminhar se</h3>'+bullets(res.encaminhar)+'</div>'+
  (tests?'<p class="guia-tests">Testes: '+tests+'</p>':'')+
  '<div class="guia-foot"><button class="btn" type="button" data-goto-mode="estudo" data-goto="'+esc(res.ancora||'exame')+'">Ver ficha completa</button><button class="btn ghost" type="button" id="guiaBack">Mudar respostas</button><button class="btn ghost" type="button" id="guiaReset">Recomeçar</button></div>'+
  (summary?'<details class="guia-answers"><summary>Ver respostas</summary><p>'+summary+'</p></details>':'')+
  '<p class="guia-answers">Material educativo; não substitui julgamento clínico.</p>'+
  '</div>';
}
function guiaRender(r){
 if(!guiaInit(r))return;
 var box=$('#guiaBox');if(!box)return;
 if(guiaState.done){box.innerHTML=guiaResult(r)}
 else{
  var q=guiaNext(r);
  if(!q){guiaState.resultKey=guiaEvaluate(r);guiaState.done=true;box.innerHTML=guiaResult(r)}
  else{box.innerHTML=guiaQuestion(r,q)}
 }
 guiaBind(r);
}
function guiaBind(r){
 $$('#guiaBox .guia-opt').forEach(function(b){
  b.addEventListener('click',function(){guiaAnswer(r,b.getAttribute('data-qid'),b.getAttribute('data-val'))});
 });
 var v=$('#guiaVoltar');if(v)v.addEventListener('click',function(){guiaBack(r)});
 var gb=$('#guiaBack');if(gb)gb.addEventListener('click',function(){guiaBack(r)});
 var gr=$('#guiaReset');if(gr)gr.addEventListener('click',function(){guiaRestart(r)});
 $$('#guiaBox [data-goto]').forEach(function(b){
  b.addEventListener('click',function(){
   setMode(b.getAttribute('data-goto-mode')||'estudo',true);
   var el=document.getElementById(b.getAttribute('data-goto'));
   if(el)jumpTo(el);
  });
 });
}

}

function pageRegras(){

function pageConduta(){

function pageEncaminhar(){

function pageSnSp(){
 var content='<p class="sub">Sensibilidade (Sn) e especificidade (Sp) descrevem o desempenho de um teste, mas não dizem tudo o que você precisa na consulta.</p>'+
 '<div class="panel"><h3>O que significam</h3><ul><li><strong>Sn alta:</strong> poucos falsos negativos. Um teste muito sensível é útil para <em>excluir</em> quando negativo — mas não confirma a doença quando positivo.</li><li><strong>Sp alta:</strong> poucos falsos positivos. Um teste muito específico é útil para <em>confirmar</em> quando positivo — mas não exclui quando negativo.</li><li><strong>LR+ e LR−</strong> resumem o quanto o resultado muda a probabilidade; dependem da prevalência e do espectro da população.</li></ul></div>'+

 }

}

  return '<article class="ev-test"><div class="ev-head"><h3>'+esc(t.nome)+'</h3><span class="badge">'+esc(x.r.nome)+'</span></div>'+
   '<div class="ev-metrics"><div><b>Sn</b><span>'+esc(sn)+'</span>'+bar(sn)+'</div><div><b>Sp</b><span>'+esc(sp)+'</span>'+bar(sp)+'</div><div><b>LR</b><span>'+esc(t.lr||'—')+'</span></div></div>'+
   '<p class="small">'+esc(t.limitacao||'Evidência limitada.')+'</p>'+
   '<p class="small">'+(src?'Fonte: <a href="'+esc(src.url)+'" target="_blank" rel="noopener noreferrer">'+esc(src.autores)+' '+esc(src.ano)+'</a>'+(src.tipo?' · '+esc(src.tipo):''):'Fonte não informada.')+'</p>'+
   '<a class="ev-link" href="#/testes/'+esc(t.id)+'">Ver teste e demonstração →</a></article>';
 }).join('');
 return '<div class="wrap"><div class="regiao-head"><a class="crumb" href="#/">← Início</a><h1>Evidência dos testes</h1><p class="lede">O que sensibilidade e especificidade podem — e não podem — dizer na consulta.</p></div>'+
  '<section class="sec"><div class="ev-note"><strong>Antes de usar:</strong> nenhum teste isolado fecha diagnóstico. Os valores variam com a população, a técnica e o padrão de referência; muitos estudos são de serviços especializados. Use o conjunto (história + exame + evolução) e considere a probabilidade antes do teste.</div>'+
  '<div class="panel" style="margin-top:12px"><h3>Resumo rápido</h3><ul><li><strong>Neer e Hawkins:</strong> sensíveis, mas pouco específicos (Sn 72–79%; Sp 59–60%). Ajudam a levantar a hipótese de dor subacromial, não a confirmá-la.</li><li><strong>Jobe:</strong> evidência heterogênea; dor sem fraqueza é pouco específica. Fraqueza sem dor é mais sugestiva de ruptura parcial ou total.</li><li><strong>Lag de rotação externa:</strong> mais específico que sensível (Sn 67%; Sp 87%); positivo favorece ruptura do infraespinal.</li><li><strong>Speed:</strong> pouco sensível (Sn 32%; Sp 61%); não exclui lesão do bíceps ou SLAP.</li><li><strong>Apreensão:</strong> LR+ alto (17,2), mas sensibilidade variável; combine com história de luxação e relocation.</li><li><strong>O’Brien e drop arm:</strong> evidência limitada; use apenas como parte do conjunto.</li><li><strong>Joelho — LCA:</strong> Lachman (Sn 81%, Sp 85%) e gaveta anterior (Sn 83%, Sp 85%) são os melhores; pivot shift é específico (Sp 94%), mas pouco sensível (Sn 55%).</li><li><strong>Joelho — menisco:</strong> McMurray (Sn 61%, Sp 84%), interlinha (Sn 83%, Sp 83%) e Thessaly (Sn 75%, Sp 87%).</li><li><strong>Joelho — colaterais e patela:</strong> valgo/varo e apreensão patelar têm evidência mais limitada; use o conjunto e a história.</li><li><strong>Ottawa joelho</strong> é regra de decisão para radiografia, não teste físico; veja em Regras.</li></ul></div>'+
  '<div class="ev-grid" style="margin-top:14px">'+cards+'</div>'+
  '<p class="small" style="margin-top:14px"><a href="#/sn-sp">Como ler Sn/Sp e intervalos de confiança →</a></p></section>'+
  '<section class="sec"><h2>O que a literatura mostra</h2><div class="panel"><ul><li>A meta-análise de Hegedus et al. (2012) conclui que nenhum teste isolado do ombro pode ser recomendado de forma inequívoca; combinações melhoram pouco a acurácia.</li><li>O UpToDate reforça que o teste de Jobe baseado em dor tem desempenho ruim; fraqueza sem dor é mais específica para ruptura parcial ou total.</li><li>Valores com “variável” ou “não reportada” significam que a literatura é heterogênea ou insuficiente — não que o teste seja inútil, mas que não deve ser usado sozinho.</li></ul></div></section></div>';
}
function pageImagem(){
 var content='<div class="panel"><h3>A pergunta certa</h3><p style="font-size:15px">Antes de pedir, pergunte: o resultado vai mudar a conduta? Se a resposta é não, a imagem provavelmente não ajuda — e pode gerar achados incidentais, ansiedade e exames em cascata.</p></div>'+
 '<div class="two" style="margin-top:12px"><div class="panel do"><h3>Quando pedir</h3><ul><li>Suspeita de fratura, luxação, infecção, tumor ou síndrome da cauda equina.</li><li>Déficit neurológico progressivo.</li><li>Trauma com mecanismo de alta energia ou critérios de Ottawa positivos.</li><li>Falha do tratamento conservador otimizado, quando a imagem pode mudar a conduta (ex.: suspeita de ruptura do manguito, lesão meniscal ou ligamentar).</li><li>Planejamento cirúrgico.</li></ul></div><div class="panel dont"><h3>Quando não pedir de rotina</h3><ul><li>Dor musculoesquelética inespecífica sem bandeiras vermelhas.</li><li>Tendinopatia ou capsulite típicas, antes de tentar tratamento conservador.</li><li>Lombalgia aguda sem bandeiras vermelhas nas primeiras 6 semanas.</li><li>Busca de “explicação” para dor crônica sem mudança de conduta.</li><li>Repetição de exame sem mudança clínica.</li></ul></div></div>'+
 '<h3 style="margin-top:22px">O que os assintomáticos mostram</h3><p class="sub">Achados de imagem são comuns em pessoas sem dor. A idade muda a interpretação; o laudo não é o paciente.</p><div class="img-grid">'+
  '<div class="img-card"><h3>Ombro: manguito</h3><div class="num">0–100%</div><p>Prevalência de alterações do manguito em ombros assintomáticos em revisão sistemática (53 estudos; certeza baixa a muito baixa). Rupturas transfixantes no MRI: 0–20%.</p><p class="small">Sanders 2025</p></div>'+
  '<div class="img-card"><h3>Ombro: articulação</h3><div class="num">30–75%</div><p>Prevalência estimada de achados glenoumerais em assintomáticos; em uma amostra populacional, 20% tinham alteração labral. Achados quase tão comuns quanto em sintomáticos.</p><p class="small">SCRUTINY 2024</p></div>'+
  '<div class="img-card"><h3>Joelho</h3><div class="num">10–24%</div><p>Em adultos assintomáticos e sem trauma: 24% com defeito de cartilagem e 10% com ruptura meniscal; sobe para 43% e 19% acima de 40 anos.</p><p class="small">Culvenor 2019</p></div>'+
  '<div class="img-card"><h3>Coluna</h3><div class="num">37–96%</div><p>Degeneração discal em assintomáticos: 37% aos 20 anos e 96% aos 80. Abaulamento discal: 30% aos 20 e 84% aos 80.</p><p class="small">Brinjikji 2015</p></div>'+
 '</div>'+
 '<div class="ev-note" style="margin-top:14px"><strong>O que isso significa:</strong> um achado no laudo não prova que ele é a causa da dor. Correlacione com a história e o exame; trate a função e os sintomas, não apenas a imagem. Em ombros assintomáticos, a prevalência de alterações do manguito variou de 0% a 100%; a certeza da evidência é baixa.</div>'+
 '<h3 style="margin-top:22px">Como escolher</h3><div class="panel"><ul><li><strong>Radiografia:</strong> osso, alinhamento, fratura, luxação, artrose e calcificação.</li><li><strong>Ultrassom:</strong> manguito, derrame, tendões e partes moles; depende do examinador.</li><li><strong>Ressonância:</strong> partes moles, lesão labral, planejamento cirúrgico e dúvida diagnóstica; maior custo e mais achados incidentais.</li><li><strong>TC:</strong> osso complexo e trauma; radiação.</li></ul><p class="small">A escolha depende da pergunta clínica e do que está disponível no SUS local.</p></div>'+
 '<h3 style="margin-top:22px">Pérolas</h3><div class="two-col"><div><div class="pearl"><b>Pérola</b><p>Se a imagem não muda a conduta, não peça.</p></div><div class="pearl"><b>Pérola</b><p>Compare com o lado são e com a idade do paciente.</p></div></div><div><div class="trap"><b>Armadilha</b><p>Tratar o laudo e não o paciente.</p></div><div class="trap"><b>Armadilha</b><p>Repetir imagem sem mudança clínica.</p></div></div></div>'+
 refLine(['ref-sanders-2025','ref-ibounig-2024-scrutiny','ref-thothong-2025','ref-culvenor-2019','ref-brinjikji-2015','ref-ms-2022']);
 return '<div class="wrap"><div class="regiao-head"><a class="crumb" href="#/">← Início</a><h1>Utilidade da imagem</h1><p class="lede">Quando a imagem ajuda a decidir — e quando ela só acrescenta achados que não explicam a dor.</p></div><section class="sec">'+content+'</section></div>';
}
function pageTestes(){
 var items=[];
 DATA.regioes.forEach(function(r){
  if(r.status==='em-breve')return;
  (r.testes||[]).forEach(function(t){items.push({r:r,t:t})});
 });
 items.sort(function(a,b){return (DEMOS[a.t.id]||99)-(DEMOS[b.t.id]||99)});
 var cards=items.map(function(x){
  return '<a class="test-card" href="#/testes/'+esc(x.t.id)+'"><span class="badge '+(DEMOS[x.t.id]?'ok':'')+'">'+(DEMOS[x.t.id]?'3D interativo':'Demonstração em breve')+'</span><h3>'+esc(x.t.nome)+'</h3><p>'+esc(x.t.interpretacao)+'</p><span class="test-region">'+esc(x.r.nome)+'</span></a>';
 }).join('');
 return '<div class="wrap"><div class="regiao-head"><a class="crumb" href="#/">← Início</a><h1>Testes e manobras</h1><p class="lede">Entenda a posição, a força e a interpretação de cada manobra. Ombro e joelho já estão disponíveis; as outras regiões entram em seguida.</p><div class="page-links"><a class="btn ghost" href="#/evidencia">Ver tabela de evidência</a></div></div><section class="sec"><div class="test-grid">'+cards+'</div></section></div>';
}
function pageTeste(id){
 var f=findTest(id);
 if(!f)return pageNotFound();
 var r=f.regiao,t=f.teste;
 var demo=id==='jobe'?renderJobeDemo():id==='neer'?renderNeerDemo():id==='hawkins'?renderHawkinsDemo():(DEMOS[id]?renderGenericDemo(id):'<div class="placeholder"><b>Demonstração visual em breve</b>A técnica e a evidência estão abaixo.</div>');
 var steps=t.passos?'<ol class="steps">'+t.passos.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ol>':bullets(t.como);
 var evidence='<div class="ev"><span>Sn '+esc(t.sn||'não reportada')+'</span><span>Sp '+esc(t.sp||'não reportada')+'</span>'+(t.ic?'<span>IC '+esc(t.ic)+'</span>':'')+(t.lr?'<span>'+esc(t.lr)+'</span>':'')+'</div><p style="font-size:14px">'+esc(t.limitacao||'Evidência limitada ou heterogênea.')+'</p>'+refLine([t.fonte].concat(r.id==='ombro'&&DEMOS[id]?['ref-uptodate-shoulder-exam']:[]))+'<p class="small" style="margin-top:8px"><a href="#/evidencia">Ver tabela consolidada de evidência →</a></p>';
 var detail=DEMOS[id]
  ? '<h2>Evidência e limitações</h2>'+evidence
  : '<h2>Como fazer</h2>'+steps+'<h3>O que é positivo</h3>'+bullets(t.positivo)+'<h3>Como interpretar</h3>'+bullets(t.interpretacao)+'<h2>Evidência e limitações</h2>'+evidence;
 var related=(r.testes||[]).filter(function(x){return x.id!==t.id}).map(function(x){return '<a class="chip" href="#/testes/'+esc(x.id)+'">'+esc(x.nome)+'</a>'}).join('');
 return '<div class="wrap"><div class="regiao-head"><a class="crumb" href="#/testes">← Testes</a><h1>'+esc(t.nome)+'</h1><p class="lede">Aprenda a posição, a força e o que o resultado significa na prática.</p><div class="meta-row"><span class="badge">'+esc(r.nome)+'</span>'+(DEMOS[id]?'<span class="badge ok">Demonstração interativa</span>':'<span class="badge draft">Demonstração em breve</span>')+'<span class="badge draft">Em revisão clínica</span></div></div>'+
  '<section class="sec">'+demo+'</section>'+
  '<section class="sec">'+detail+'</section>'+
  '<section class="sec"><h2>Testes relacionados</h2><div class="chips">'+related+'</div><p class="small" style="margin-top:12px"><a href="#/'+esc(r.id)+'">Voltar à ficha de '+esc(r.nome)+'</a></p></section>'+
  '</div>';
}
function pageNotFound(){
 return '<div class="wrap"><div class="regiao-head"><a class="crumb" href="#/">← Início</a><h1>Não encontrado</h1><p class="lede">Esta página não existe. Volte ao início ou use a busca.</p></div></div>';
}

/* ---------- routing ---------- */
function route(){
 var h=location.hash.replace(/^#\/?/,'');
 var parts=h.split('/').filter(Boolean).map(function(x){try{return decodeURIComponent(x)}catch(e){return x}});
 var a=parts[0];
 if(!a)return pageHome();
 if(a==='testes')return parts[1]?pageTeste(parts[1]):pageTestes();
 if(a==='evidencia')return pageEvidencia();
 if(a==='imagem')return pageImagem();
 if(a==='bandeiras')return pageBandeiras();
 if(a==='regras')return pageRegras();
 if(a==='conduta')return pageConduta();
 if(a==='encaminhar')return pageEncaminhar();
 if(a==='sn-sp')return pageSnSp();
 if(a==='referencias')return pageReferencias();
 if(a==='sobre')return pageSobre();
 var r=byId(a);
 if(!r)return pageNotFound();
 var b=parts[1],c=parts[2];
 if(b==='teste'&&c){setMode('estudo',true);pendingAnchor='teste-'+c;return pageRegiao(r)}
 if(b==='dx'&&c){setMode('estudo',true);pendingAnchor='dx-'+c;return pageRegiao(r)}
 if(b){setMode('estudo',true);pendingAnchor=b;return pageRegiao(r)}
 return pageRegiao(r);
}
function setTopHeight(){
 var header=$('header.top');
 if(header)document.documentElement.style.setProperty('--topbar',header.offsetHeight+'px');
}
function setActiveNav(){
 var h=location.hash.replace(/^#\/?/,'').split('/')[0];
 $$('.navlinks a').forEach(function(a){
  var href=a.getAttribute('href')||'';
  var key=href.replace(/^#\/?/,'').split('/')[0];
  if(key&&key===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
 });
}
function bindPage(){
 $$('#main [data-mode]').forEach(function(b){b.addEventListener('click',function(){setMode(b.getAttribute('data-mode'),true)})});
 var rid=location.hash.replace(/^#\/?/,'').split('/')[0];
 var rr=byId(rid);
 if(rr&&rr.guia&&$('#guiaBox'))guiaRender(rr);
 if($('#jobe3d'))initJobeDemo();
 if($('#neer3d'))initShoulderDemo('neer');
 if($('#hawkins3d'))initShoulderDemo('hawkins');
 ['lag-re','apreensao','speed','obrien','drop-arm','lift-off','lachman','gaveta-anterior','mcmurray','valgo','varo','apreensao-patelar','ballottement'].forEach(function(id){if($('#'+id+'3d'))initGenericDemo(id)});
 var ev=$('#btnEvidence');
 if(ev){
  ev.addEventListener('click',function(){
   var open=ev.getAttribute('aria-pressed')!=='true';
   $$('#main details').forEach(function(d){d.open=open});
   ev.setAttribute('aria-pressed',open?'true':'false');
   ev.textContent=open?'Ocultar evidência':'Mostrar evidência';
  });
 }
 var pr=$('#btnPrint');
 if(pr)pr.addEventListener('click',function(){$$('#main details').forEach(function(d){d.open=true});window.print()});
 $$('#main .chip').forEach(function(ch){
  ch.addEventListener('click',function(){
   var q=ch.getAttribute('data-q')||'';
   var input=$('#q');
   if(input){input.value=q;input.focus();showResults(q)}
  });
 });
}
function jumpTo(el){
 var html=document.documentElement;
 var prev=html.style.scrollBehavior;
 html.style.scrollBehavior='auto';
 var header=$('header.top');
 var offset=(header?header.offsetHeight:0)+54;
 var top=el.getBoundingClientRect().top+window.pageYOffset-offset;
 window.scrollTo(0,Math.max(0,top));
 html.style.scrollBehavior=prev;
}
function render(){
 var isHome=!location.hash||location.hash==='#/'||location.hash==='#/';
 if(isHome)setMode('consulta',true);
 var html=route();
 if(window.__jobe3d){window.__jobe3d.dispose();window.__jobe3d=null}
 if(window.__shoulder3d){window.__shoulder3d.dispose();window.__shoulder3d=null}
 if(window.__knee3d){window.__knee3d.dispose();window.__knee3d=null}
 $('#main').innerHTML=html;
 setMode(getMode(),false);
 setActiveNav();
 setTopHeight();
 if(pendingAnchor){
  var el=document.getElementById(pendingAnchor);
  if(el){jumpTo(el);el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},1300)}
  pendingAnchor=null;
 }else{
  var h=$('#main h1');
  if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
 }
 bindPage();
 var fv=$('#footVer'),fs=$('#footStatus');
 if(fv)fv.textContent=DATA.meta.versao;if(fs)fs.textContent=DATA.meta.status;
}
function showResults(q){
 var panel=$('#searchPanel'),input=$('#q');
 var results=search(q);
 if(!q||norm(q).trim().length<2){panel.hidden=true;input.setAttribute('aria-expanded','false');return}
 if(!results.length){
  panel.innerHTML='<div class="sr-empty">Nenhum resultado para “'+esc(q)+'”. Tente “ombro”, “Neer” ou “capsulite”.</div>';
 }else{
  panel.innerHTML=results.map(function(r){
   return '<a class="sr-item" href="'+esc(r.url)+'"><span class="tipo">'+esc(r.tipo)+'</span><span class="tit">'+esc(r.titulo)+'</span><span class="desc">'+esc(snippet(r.texto,q))+'</span></a>';
  }).join('');
 }
 panel.hidden=false;input.setAttribute('aria-expanded','true');
}
function init(){
 buildIndex();
 setTopHeight();
 addEventListener('resize',setTopHeight);
 var input=$('#q'),panel=$('#searchPanel'),timer=null;
 input.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){showResults(input.value)},70)});
 input.addEventListener('keydown',function(e){if(e.key==='Escape'){input.value='';panel.hidden=true;input.setAttribute('aria-expanded','false');input.blur()}});
 document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==input&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();input.focus()}
 });
 panel.addEventListener('click',function(e){
  if(e.target.closest('a')){panel.hidden=true;input.value='';input.setAttribute('aria-expanded','false')}
 });
 document.addEventListener('click',function(e){
  if(!e.target.closest('.searchbox')){panel.hidden=true;input.setAttribute('aria-expanded','false')}
 });
 var saved=null;try{saved=localStorage.getItem('semiologia-tema')}catch(e){}
 if(saved==='light'||saved==='dark')document.documentElement.setAttribute('data-theme',saved);
 $('#theme').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  var effective=cur||(sysDark?'dark':'light');
  var next=effective==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('semiologia-tema',next)}catch(e){}
 });
 addEventListener('beforeprint',function(){$$('details').forEach(function(d){d.dataset.wasOpen=d.open?'1':'0';d.open=true})});
 addEventListener('afterprint',function(){$$('details').forEach(function(d){if(d.dataset.wasOpen==='0')d.open=false;delete d.dataset.wasOpen})});
 addEventListener('hashchange',render);
 render();
}
init();
})();
</script>
</body>
</html>
